name: Build Windows Executable

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build cs-match-helper.exe
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: 'v4.0.0-clean-build'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build frontend
        run: npm run build:frontend

      - name: Build Tauri executable (Release)
        run: npm run build:exe -- --ci

      - name: Verify build artifact
        shell: pwsh
        run: |
          $exePath = "src-tauri/target/release/cs-match-helper.exe"
          if (Test-Path $exePath) {
            $item = Get-Item $exePath
            Write-Host "Build succeeded: $exePath ($([math]::Round($item.Length / 1MB, 2)) MB)"
          } else {
            throw "Executable not found at $exePath"
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cs-match-helper-windows
          path: src-tauri/target/release/cs-match-helper.exe
          if-no-files-found: error
          retention-days: 30

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/cs-match-helper.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
