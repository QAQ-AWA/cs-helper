<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f1117" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>CS Helper · 对局房间</title>
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/static/icon.svg" />
<link rel="stylesheet" href="/static/mobile.css" />
</head>
<body>
<header>
  <button id="back" class="back hidden" aria-label="返回">←</button>
  <div class="code" id="code">----</div>
  <div class="muted" id="hint">连接中…</div>
  <div class="dot" id="dot"></div>
</header>

<main id="view-room" class="cards">
  <section class="card">
    <h2>当前对局</h2>
    <div class="map"><b id="map">等待电脑端检测…</b><span class="pill" id="countdown"></span></div>
    <div class="muted" id="demo-status" style="margin-top:6px"></div>
  </section>

  <section class="card hidden" id="teams-card">
    <h2>双方阵容</h2>
    <div class="teams">
      <div class="team ct"><h3>CT</h3><div id="team-ct"></div></div>
      <div class="team t"><h3>T</h3><div id="team-t"></div></div>
    </div>
    <div class="muted" id="profile-source" style="margin-top:8px"></div>
  </section>

  <section class="card hidden" id="paths-card">
    <h2>习惯轨迹</h2>
    <div id="paths-list" class="paths"></div>
  </section>

  <section class="card hidden" id="ai-card">
    <h2>AI 战术分析</h2>
    <div id="ai"></div>
  </section>

  <section class="card">
    <h2>房间成员</h2>
    <div class="members" id="members"><span class="muted">暂无</span></div>
  </section>
</main>

<section id="view-player" class="hidden">
  <div class="player-head">
    <div>
      <b id="p-name">选手</b>
      <div class="muted" id="p-stats"></div>
    </div>
    <span class="pill" id="p-rounds"></span>
  </div>

  <div class="canvas-wrap"><canvas id="replay"></canvas></div>

  <div class="controls">
    <button id="play" class="primary">暂停</button>
    <div class="seg" id="speed">
      <button data-speed="1">1x</button>
      <button data-speed="2" class="on">2x</button>
      <button data-speed="4">4x</button>
    </div>
    <div class="seg" id="side">
      <button data-side="" class="on">全部</button>
      <button data-side="CT">CT</button>
      <button data-side="T">T</button>
    </div>
  </div>

  <div class="progress" id="progress"><div id="progress-bar"></div></div>
  <div class="muted" id="p-legend">路径越集中，说明该选手的开局习惯越固定。</div>
</section>

<div class="join" id="join">
  <div class="box">
    <h1>加入对局房间</h1>
    <p id="join-hint">向开黑队友要 6 位房间码，或直接扫描电脑端二维码。</p>
    <input id="nick" placeholder="你的昵称" maxlength="24" autocomplete="nickname" />
    <button id="join-btn">加入房间</button>
    <div class="err" id="join-err"></div>
  </div>
</div>

<script type="module" src="/static/mobile.js"></script>
</body>
</html>
