<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f5f6f8" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<title>CS Helper · 对局房间</title>
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/static/icon.svg" />
<link rel="stylesheet" href="/static/mobile.css" />
</head>
<body>

<header class="topbar">
  <div class="topbar-main">
    <span class="code" id="code">----</span>
    <span class="map" id="map">等待电脑端检测…</span>
    <span class="countdown" id="countdown"></span>
  </div>
  <div class="topbar-side">
    <span class="conn"><span class="dot" id="dot"></span><span id="hint">连接中…</span></span>
    <button type="button" class="icon-btn" id="leave" aria-label="退出房间" title="退出房间">⏻</button>
  </div>
</header>

<nav class="tabs" id="tabs" role="tablist">
  <button type="button" data-tab="roster" class="on" role="tab">阵容</button>
  <button type="button" data-tab="analysis" role="tab">分析</button>
  <button type="button" data-tab="paths" role="tab">轨迹</button>
  <button type="button" data-tab="post" role="tab">赛后</button>
</nav>

<main id="view-room">

  <!-- 阵容 -->
  <section class="panel" data-panel="roster">
    <div class="side-bar">
      <span class="side-label" id="side-label">我方未定</span>
      <button type="button" class="btn small" id="pick-side">选阵营</button>
    </div>
    <div id="roster" class="roster"></div>
    <div class="note" id="season-source"></div>
    <div class="note" id="profile-source"></div>
  </section>

  <!-- 分析 -->
  <section class="panel hidden" data-panel="analysis">
    <div id="ai" class="ai"></div>
    <div class="card hidden" id="tactics-card">
      <h3 class="card-title">开局预判</h3>
      <div id="tactics" class="md"></div>
    </div>
  </section>

  <!-- 轨迹 -->
  <section class="panel hidden" data-panel="paths">
    <div class="card">
      <h3 class="card-title">习惯轨迹</h3>
      <div class="note" id="demo-status">等待电脑端解析…</div>
      <div id="paths-list" class="paths"></div>
    </div>
  </section>

  <!-- 赛后 -->
  <section class="panel hidden" data-panel="post">
    <div id="post" class="post"></div>
  </section>

  <footer class="foot">
    <div class="members" id="members"><span class="muted">房间成员加载中…</span></div>
  </footer>
</main>

<!-- 单人轨迹 -->
<section id="view-player" class="player-view hidden">
  <div class="player-head">
    <button type="button" id="back" class="icon-btn" aria-label="返回">←</button>
    <div class="player-meta">
      <b id="p-name">选手</b>
      <div class="muted" id="p-stats"></div>
    </div>
    <span class="pill" id="p-rounds"></span>
  </div>
  <div class="canvas-wrap"><canvas id="replay"></canvas></div>
  <div class="controls">
    <button type="button" id="play" class="btn primary">暂停</button>
    <div class="seg" id="speed">
      <button type="button" data-speed="1">1x</button>
      <button type="button" data-speed="2" class="on">2x</button>
      <button type="button" data-speed="4">4x</button>
    </div>
    <div class="seg" id="side">
      <button type="button" data-side="" class="on">全部</button>
      <button type="button" data-side="CT">CT</button>
      <button type="button" data-side="T">T</button>
    </div>
  </div>
  <div class="progress" id="progress"><div id="progress-bar"></div></div>
  <div class="note center" id="p-legend">路径越集中，说明该选手的开局习惯越固定。</div>
</section>

<!-- 加入房间 -->
<div class="sheet-backdrop" id="join">
  <div class="sheet">
    <h1>加入对局房间</h1>
    <p class="muted" id="join-hint">向队友要房间码，或直接扫描电脑端二维码。</p>
    <input id="nick" placeholder="你的昵称" maxlength="24" autocomplete="nickname" />
    <button type="button" id="join-btn" class="btn primary block">加入房间</button>
    <div class="err" id="join-err"></div>
  </div>
</div>

<!-- 选阵营 -->
<div class="sheet-backdrop hidden" id="side-sheet">
  <div class="sheet">
    <h1>我们在哪边</h1>
    <p class="muted">选错边会把整份分析翻到对手身上。选完只下载对面 5 人的录像。</p>
    <button type="button" class="side-option" data-side="ct">
      <b>我方是 CT</b><span class="muted" id="side-ct-names"></span>
    </button>
    <button type="button" class="side-option" data-side="t">
      <b>我方是 T</b><span class="muted" id="side-t-names"></span>
    </button>
    <div class="row">
      <button type="button" class="btn ghost" id="side-all">先不分敌我，十个人都看</button>
      <button type="button" class="btn ghost" id="side-close">取消</button>
    </div>
    <button type="button" id="remember-side" class="btn ghost block hidden">把我方这 5 人记进 ID 库</button>
    <div class="note center" id="side-hint"></div>
  </div>
</div>

<script type="module" src="/static/mobile.js"></script>
</body>
</html>
